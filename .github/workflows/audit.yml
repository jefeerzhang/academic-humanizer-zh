name: audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # C0–C2 red-line audit. Exit 0 must pass; any non-zero fails the build.
  red-lines:
    name: C0–C2 red lines (validate_red_lines.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Smoke test on shipped examples
        run: |
          set -e
          python scripts/validate_red_lines.py examples/before-after-zh-academic.md
          python scripts/validate_red_lines.py examples/before-after-tri-research-report-zh.md

  # Layer 7 injection audit. Exit 0/1 (PASS/WARN) pass; exit 2 (FAIL) blocks.
  layer7:
    name: Layer 7 injection (validate_layer7_injection.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Layer 7 audit on shipped example
        run: |
          set +e
          python scripts/validate_layer7_injection.py --combined examples/before-after-zh-academic-injection.md
          rc=$?
          set -e
          if [ $rc -eq 2 ]; then
            echo "::error::Layer 7 audit FAIL (exit 2) — first-person abuse / hedge in Results / blacklist hit"
            exit 2
          fi
          if [ $rc -eq 1 ]; then
            echo "::warning::Layer 7 audit returned WARN (exit 1) — contract honored but soft warning emitted"
            exit 0
          fi
          exit $rc